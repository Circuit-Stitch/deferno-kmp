# XcodeGen spec for the native macOS app (ADR-0029). Generates macosApp.xcodeproj from this
# declarative source of truth — cleaner + less error-prone than a hand-edited .pbxproj. SQLCipher (for
# the encrypted per-Account DB, ADR-0029 Phase 1b / #188) is linked via **CocoaPods** — the SAME pod
# app/iosApp uses (Zetetic's stock `SQLCipher ~> 4.6` amalgamation), so the shared SQLiter driver's
# `sqlite3_*` symbols (including the deprecated ones it still references) resolve with no shim. See the
# Podfile. Because the pod integrates by editing the generated project, the build is a two-step flow:
#   cd app/macosApp && xcodegen generate && pod install     # then build the .xcworkspace
name: macosApp
options:
  bundleIdPrefix: com.circuitstitch.deferno
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# The three environment build variants (ADR-0047, #368 G22) — the macOS twins of iosApp's configurations
# and of Android's flavor×buildType matrix. XcodeGen defaults to just Debug/Release when this key is
# absent, so the custom third configuration has to be declared here, mapped to the BASE type it builds
# like (that base type is what drives optimisation level, ENABLE_TESTABILITY, `DEBUG=1`, …):
#
#   Debug      → Staging    · com.circuitstitch.deferno.macos.staging.debug · "Deferno Dev"
#   ProdDebug  → Production · com.circuitstitch.deferno.macos.debug         · "Deferno β"
#   Release    → Production · com.circuitstitch.deferno.macos               · "Deferno"
#
# ONE-TIME MIGRATION COST: Debug's bundle id moves off the old base `…deferno.macos`, so the next Debug
# build is a NEW app to the OS — it orphans the current local install's login-Keychain items (service
# com.circuitstitch.deferno.bearer) and its per-Account `deferno-<id>.db`. That is the ADR's *intent*
# (OS-level isolation between the three worlds, ADR-0047), and it is painless: dev-PAT seeding re-seeds
# the Account on the next launch. Release keeps the old id precisely so a prod install upgrades in place.
#
# (Not to be confused with `settings.configs:` below, which holds per-configuration *settings*.)
configs:
  Debug: debug
  ProdDebug: debug
  Release: release

# Machine-local signing, applied as the PROJECT-level base config (the slot CocoaPods leaves alone — it
# owns each target's base config, the Pods xcconfig). Carrying the identity here means Xcode-GUI builds
# pick up the same stable signature as `build.sh`, so the login-Keychain ACL on the bearer token survives
# rebuilds and stops re-prompting (see Local.xcconfig). The file is gitignored; build.sh seeds an ad-hoc
# default ("-") when it's absent, so a fresh clone / CI still generates + builds with no Dev account.
# Every configuration gets it — a config with no entry would build unsigned-by-default and re-prompt.
configFiles:
  Debug: Local.xcconfig
  ProdDebug: Local.xcconfig
  Release: Local.xcconfig

# Give Local.xcconfig a parented file reference in the navigator. Without this, XcodeGen leaves the
# config file in an orphan group (no parent), and `pod install`'s xcodeproj walk throws
# "[Xcodeproj] Consistency issue: no parent for object Local.xcconfig". Listing it here dedups the
# base-config reference onto a properly-grouped one, so CocoaPods can resolve its path.
fileGroups:
  - Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Mixed Swift/Obj-C: the bridging header exposes DFNExceptionCatcher (wraps AVFoundation NSExceptions
    # that Kotlin/Native can't catch). Path is relative to SRCROOT (app/macosApp).
    SWIFT_OBJC_BRIDGING_HEADER: macosApp/macosApp-Bridging-Header.h
    # PRODUCT_BUNDLE_IDENTIFIER is deliberately NOT here — it is per-configuration (ADR-0047), see
    # `settings.configs` below. The app-target-shaped values that stay in `base` are the ones every
    # configuration shares.
    # The app name "Deferno" (the built product is Deferno.app, executable Deferno). This is the source
    # of CFBundleName, which the menu bar + Finder read (#189) — a partial-Info.plist CFBundleName gets
    # overwritten by GENERATE_INFOPLIST_FILE's synthesized $(PRODUCT_NAME), so it must be set here. The
    # Xcode TARGET stays "macosApp" (so the scheme + CocoaPods `Pods-macosApp` integration are unchanged).
    PRODUCT_NAME: Deferno
    # …but the Swift MODULE name must NOT become "Deferno": the Kotlin framework is also named `Deferno`,
    # so a "Deferno" app module shadows it — `import Deferno` self-imports and every framework symbol
    # (BridgeKt, StateFlowBridge, *Component) goes "cannot find type". Pin the module name to the old
    # target name to keep the framework import resolving (#189). PRODUCT_MODULE_NAME defaults to
    # PRODUCT_NAME, so it has to be set explicitly.
    PRODUCT_MODULE_NAME: macosApp
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    # The custom URL scheme (CFBundleURLTypes) the OAuth redirect re-enters on (ADR-0026, #137) can't be
    # expressed by an INFOPLIST_KEY_* setting, so a partial Info.plist carries it; GENERATE_INFOPLIST_FILE
    # stays YES and merges the synthesized + INFOPLIST_KEY_* keys on top (explicit keys win). Mirrors iosApp.
    INFOPLIST_FILE: macosApp/Info.plist
    INFOPLIST_KEY_NSHumanReadableCopyright: ""
    # The Dock/Finder app icon: the flame brandmark, generated from the iOS 1024 source into
    # macosApp/Assets.xcassets/AppIcon.appiconset (#189). Without this the app shows the generic icon.
    # (CFBundleName comes from PRODUCT_NAME above — it has no INFOPLIST_KEY_* equivalent. The *display*
    # name IS per-configuration, so INFOPLIST_KEY_CFBundleDisplayName lives in `settings.configs` below —
    # ADR-0047's "never confuse the three installs" rule.)
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Dictation TCC usage strings (ADR-0029 Phase 2): the in-process SpeechTranscriber prompts under THIS
    # app's identity, so the strings live here (not in the launchd Helper's embedded plist, ADR-0024). The
    # app is not sandboxed (ad-hoc dev signing), so the usage strings alone satisfy mic/Speech TCC — no
    # entitlement is needed. (When the app gains the App Sandbox, add com.apple.security.device.audio-input.)
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Deferno transcribes your dictation on-device to fill in a new item."
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Deferno recognizes your speech on-device to fill in a new item — the audio never leaves your Mac."
    # Signing identity is NOT set here — it lives in the project-level Local.xcconfig (`configFiles`
    # above) so the same stable identity reaches Xcode-GUI builds, not just build.sh. A setting here would
    # OVERRIDE that base config, so CODE_SIGN_IDENTITY must stay out of this block. REQUIRED/ALLOWED stay:
    # they gate only whether the app target signs (the static Pods/SidecarKit targets keep ALLOWED = NO),
    # and the ad-hoc-by-default path (no Dev account) is preserved by build.sh's seeded Local.xcconfig.
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES
    # The shared Kotlin/Native static `Deferno.framework`, staged by the gradle pre-build phase into
    # $(SRCROOT)/build/xcode-frameworks (the iosApp pattern). Linked, plus the system libs the linked
    # graph references: Security (Keychain vault), Network (NWPathMonitor). The `sqlite3_*` symbols the
    # statically-linked SQLiter driver references are NOT satisfied by the system `-lsqlite3` (no codec) —
    # the CocoaPods `SQLCipher` (Podfile) is their SOLE provider (its link flags flow in via $(inherited)
    # from the Pods xcconfig), so there's exactly one sqlite implementation (no duplicate symbols) plus
    # real `PRAGMA key` encryption-at-rest (ADR-0009). The SQLiter cinterop's own system-sqlite linker opt
    # is not propagated into the app, so SQLCipher cleanly satisfies the undefined symbols (exactly as
    # app/iosApp does — and the stock pod still ships the deprecated `sqlite3_*` the cinterop wraps).
    FRAMEWORK_SEARCH_PATHS:
      - "$(inherited)"
      # The CONFIG-QUALIFIED path, and ONLY that one — it is where the Gradle task actually stages:
      # build/xcode-frameworks/<CONFIGURATION>/<SDK_NAME>/Deferno.framework. Nothing is ever written to
      # the bare `build/xcode-frameworks` directory this used to also list, so that entry could never
      # resolve a framework; the link has really been finding the copy the task drops in
      # $BUILT_PRODUCTS_DIR. A search path that can only ever match a stale artifact is worse than no
      # search path — a mis-declared configuration should fail to link, not link something else.
      # iosApp lists exactly this one form (project.pbxproj FRAMEWORK_SEARCH_PATHS, 6×).
      - "$(SRCROOT)/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS:
      - "$(inherited)"
      - "-framework"
      - "Deferno"
      - "-framework"
      - "Security"
      - "-framework"
      - "Network"
      # Apple Intelligence / Foundation Models (ADR-0029 Phase 3) — macOS 26 only. Weak-linked so the
      # app still loads on the 14.0 deployment target; all uses are `@available(macOS 26, *)`-guarded
      # and gate on `SystemLanguageModel.availability` at runtime (MacInference.swift).
      - "-weak_framework"
      - "FoundationModels"
  # Per-CONFIGURATION settings — the three coexisting environment variants (ADR-0047, #368 G22). Each
  # value here is written to the PROJECT-level configuration, so it reaches the app target; the test
  # target overrides what it must in its own `settings.base` (target settings outrank project ones).
  #
  # DEV-PAT SEEDING IS OPT-IN, NOT OPT-OUT (ADR-0012/0047). The Info.plist reads two *seed slots* —
  # DEFERNO_SEED_STAGING_TOKEN and DEFERNO_SEED_ACCOUNTS — that NOTHING defines by default, and an
  # undefined build setting expands to empty, so a configuration seeds nothing unless it says otherwise.
  # Each config below opts in by mapping the slot it wants to the secret that feeds it (the secret names
  # DEV_STAGING_TOKEN / DEV_ACCOUNTS are unchanged, so Secrets.xcconfig stays identical to iosApp's).
  # The earlier shape pinned the *other* variant's secret to "" in each config — three pins defending
  # ADR-0047's core safety property ("a Production install can never seed a staging PAT") by memory, and
  # a fourth configuration added later would have inherited both secrets by simply not mentioning them.
  #
  # ALL THREE configs must spell out PRODUCT_BUNDLE_IDENTIFIER, not just the two that differ from the old
  # base value: `options.bundleIdPrefix` auto-generates a TARGET-level id for any target XcodeGen thinks
  # has none, and a target-level value would outrank everything here — silently collapsing all three
  # variants back onto one `com.circuitstitch.deferno.macosApp` id, which still *builds*. XcodeGen's check
  # reads the project's combined per-config settings (that is why the pre-ADR-0047 `settings.base` value
  # already suppressed it), so a value in every config keeps it suppressed.
  configs:
    Debug:
      # Staging, the dev/validation target — no longer the daily driver (ADR-0047).
      DEFERNO_ENV: Staging
      PRODUCT_BUNDLE_IDENTIFIER: com.circuitstitch.deferno.macos.staging.debug
      INFOPLIST_KEY_CFBundleDisplayName: "Deferno Dev"
      # …and the ONLY config that seeds a staging PAT. The prod-accounts slot goes unmentioned, so it
      # expands to empty and a prod Test PAT cannot reach the Staging install.
      DEFERNO_SEED_STAGING_TOKEN: "$(DEV_STAGING_TOKEN)"
    ProdDebug:
      # Production + debuggable + distinctly bundled: the prod-repro / Claude-driving install (ADR-0047).
      DEFERNO_ENV: Production
      PRODUCT_BUNDLE_IDENTIFIER: com.circuitstitch.deferno.macos.debug
      INFOPLIST_KEY_CFBundleDisplayName: "Deferno β"
      # The one config that seeds the disposable prod **Test** Account from a gitignored Secrets.xcconfig.
      # The staging-token slot goes unmentioned — that omission IS ADR-0047's core safety property: a
      # Production-env install can never seed a *staging* PAT, even though the shared
      # Local.xcconfig ← Secrets.xcconfig chain feeds both debuggable configs.
      DEFERNO_SEED_ACCOUNTS: "$(DEV_ACCOUNTS)"
      # LOAD-BEARING: the Kotlin Gradle plugin infers the framework build type from the CONFIGURATION
      # name, and only literally "Debug"/"Release" are recognised — an unknown name would link the wrong
      # build type (or none). Pin it, exactly as iosApp's ProdDebug config does (project.pbxproj:775).
      KOTLIN_FRAMEWORK_BUILD_TYPE: debug
    Release:
      DEFERNO_ENV: Production
      # Unchanged from the pre-ADR-0047 base value, so an existing local prod install upgrades in place
      # rather than becoming a fourth app.
      PRODUCT_BUNDLE_IDENTIFIER: com.circuitstitch.deferno.macos
      INFOPLIST_KEY_CFBundleDisplayName: Deferno
      # Neither seed slot is mentioned, so a Release build seeds nothing regardless of any local
      # Secrets.xcconfig — by saying nothing rather than by remembering to say "" (#282, ADR-0012/0047).

# The macOS Sidecar Helper's Swift package, linked as a LOCAL SwiftPM dependency (ADR-0029 Phase 2) so
# the app reuses SpeechTranscriber / SidecarPermissions in-process. Path is relative to this spec.
# (SQLCipher is CocoaPods, not SwiftPM — see the Podfile + the OTHER_LDFLAGS note above.)
packages:
  SidecarKit:
    path: ../../helpers/macos

targets:
  macosApp:
    type: application
    platform: macOS
    sources:
      - path: macosApp
    dependencies:
      - package: SidecarKit
        product: SidecarKit
    preBuildScripts:
      - name: "Build shared Kotlin framework"
        basedOnDependencyAnalysis: false
        script: |
          # Builds + stages the shared Kotlin/Native static `Deferno.framework` for the current Xcode
          # CONFIGURATION/SDK/ARCHS into $SRCROOT/build/xcode-frameworks (FRAMEWORK_SEARCH_PATHS). The
          # IDE-support guard mirrors app/iosApp.
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle: invoked from Kotlin IDE build support."
            exit 0
          fi
          cd "$SRCROOT/../.."
          ./gradlew :app:macosApp:embedAndSignAppleFrameworkForXcode

  # The XCTest bundle — the macOS twin of app/iosApp's `iosAppTests` target, and what
  # .github/workflows/macos.yml runs. Hosted by the app (`dependencies: target: macosApp` makes
  # XcodeGen set TEST_HOST/BUNDLE_LOADER), so `@testable import macosApp` resolves the app module and
  # the statically-linked `Deferno.framework` symbols come from the host at load time — the test bundle
  # links neither the framework nor the pod itself (see OTHER_LDFLAGS below).
  macosAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: macosAppTests
    dependencies:
      - target: macosApp
    # `settings.base` above is written to the PROJECT-level configuration, so every one of its
    # app-shaped values lands on this target too. Most are harmless; the ones below are not, and each is
    # overridden WITHOUT `$(inherited)` so the project value is genuinely replaced, not appended to.
    settings:
      base:
        # PRODUCT_MODULE_NAME is the load-bearing one: inheriting `macosApp` would name the *test*
        # module `macosApp`, and `@testable import macosApp` would then self-import. PRODUCT_NAME rides
        # along so the bundle is macosAppTests.xctest rather than a second "Deferno" product.
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_MODULE_NAME: "$(TARGET_NAME)"
        # Config-INDEPENDENT on purpose: the test bundle is not an install, so it needs no per-variant
        # identity, and its host is resolved by path (TEST_HOST below), not by bundle id. This TARGET-level
        # value outranks the per-configuration PRODUCT_BUNDLE_IDENTIFIERs in `settings.configs` above,
        # which are written at PROJECT level — so the three environment variants (ADR-0047) do not leak
        # into the test bundle's id.
        PRODUCT_BUNDLE_IDENTIFIER: com.circuitstitch.deferno.macosAppTests
        # …and because PRODUCT_NAME is Deferno, XcodeGen's inferred TEST_HOST is WRONG: it derives the
        # host path from the TARGET name (…/macosApp.app/Contents/MacOS/macosApp), but the built product
        # is Deferno.app/Contents/MacOS/Deferno (#189). Spell it out — a bad TEST_HOST fails the test run
        # with "Failed to load the test bundle", not a build error. (iosAppTests pins the same path.)
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Deferno.app/Contents/MacOS/Deferno"
        # Do NOT re-link the shared Kotlin framework here. It is a *static* framework, so linking it
        # into the bundle as well as the host would load a second copy of the Kotlin/Native runtime and
        # duplicate every Obj-C class in the test process. BUNDLE_LOADER already resolves those symbols
        # (and SQLCipher's) against the host executable, exactly as iosAppTests does.
        OTHER_LDFLAGS: ""
        # The app's Obj-C bridging header (DFNExceptionCatcher) and its partial Info.plist (URL scheme,
        # single-instance keys) describe the *application*; a test bundle wants neither. Clearing
        # INFOPLIST_FILE leaves GENERATE_INFOPLIST_FILE = YES to synthesize the bundle's plist.
        SWIFT_OBJC_BRIDGING_HEADER: ""
        INFOPLIST_FILE: ""

# XcodeGen writes no scheme unless one is declared, and Xcode's implicit scheme autocreation is what
# `xcodebuild -scheme macosApp` has been leaning on. That is fine for `build`, but leaves the Test
# action's membership to chance — so declare it: a shared, committed-by-generation scheme whose Test
# action runs macosAppTests, which is what makes `xcodebuild -scheme macosApp test` (build.sh --test,
# and the CI gate) actually run the suite.
#
# The per-action configs match what Xcode's implicit scheme did, so replacing it changes nothing:
# Debug for run/test/analyze, **Release for profile and archive** — Instruments must measure an
# optimised build, not a Debug one.
#
# Heads-up on a benign divergence: XcodeGen derives each action's BuildableName from the TARGET name, so
# the generated scheme says `macosApp.app` while the built product is `Deferno.app` (the PRODUCT_NAME
# override, #189). Xcode resolves buildables by BlueprintIdentifier, so this works — do NOT "fix" it, and
# do NOT re-derive the explicit TEST_HOST above from it (that one is a real path and must stay Deferno).
schemes:
  macosApp:
    build:
      targets:
        macosApp: all
        macosAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - macosAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # The ProdDebug twin (ADR-0047, #368 G22) — the macOS counterpart of
  # app/iosApp/…/xcschemes/iosApp-ProdDebug.xcscheme. EVERY action pins ProdDebug, profile and archive
  # included: this scheme exists to build/run the Production-backed debuggable install, and a profile or
  # archive action that silently fell back to Release would produce the *other* app (different bundle id,
  # different seeding) under this scheme's name — the one confusion the whole variant scheme is meant to
  # prevent. Selecting it in Xcode, or `xcodebuild -scheme macosApp-ProdDebug`, is how you drive prod.
  macosApp-ProdDebug:
    build:
      targets:
        macosApp: all
        macosAppTests: [test]
    run:
      config: ProdDebug
    test:
      config: ProdDebug
      targets:
        - macosAppTests
    profile:
      config: ProdDebug
    analyze:
      config: ProdDebug
    archive:
      config: ProdDebug
