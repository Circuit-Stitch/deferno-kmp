# iOS build CI (ADR-0006, the deliberate macOS follow-up flagged in ci.yml). The shared KMP core's
# JVM-fast tests + coverage gate run on Linux in ci.yml; iOS *linking* and the SwiftUI app can only be
# built on macOS (Kotlin/Native links the static `Deferno.framework`, then Xcode compiles the SwiftUI
# layer + links it). This job builds that whole chain on a GitHub macOS runner: it integrates the
# SQLCipher CocoaPod (ADR-0009 — the per-Account DB is encrypted at rest; the pod supplies the
# `sqlite3_*` symbols the framework references *plus* `PRAGMA key`), drives the Gradle framework build
# via the project's Run Script phase, and compiles + links the app for the iOS Simulator.
#
# Runner: macos-26 (Apple Silicon), which carries the Xcode 26 line. It ships Ruby 3 + CocoaPods +
# xcbeautify preinstalled. The arm64 simulator uses the `iosSimulatorArm64` framework slice.
#
# It was macos-14 until the Apple toolchain floor rose to Xcode 26 (below): that image tops out at Xcode
# 15.4 / the iOS 17 SDK, which cannot compile this app's sources at all — and it is deprecated besides
# (brownouts from 2026-10, removed 2026-11-02).
name: iOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & test iOS app (framework + SwiftUI, SQLCipher)
    runs-on: macos-26
    # Generous for the cold-cache first run: the Gradle Run Script downloads the Kotlin/Native compiler
    # + konan deps (~1 GB) before linking. setup-gradle caches the Gradle home, so warm runs are faster.
    timeout-minutes: 60
    steps:
      - name: Checkout
        # submodules: recursive — Gradle configures every module for any task (no configure-on-demand),
        # so :speech-whisper-jni's build script (it points at the vendored third_party/whisper.cpp) must
        # have its submodule present even though the iOS framework never executes that native build.
        uses: actions/checkout@v6
        with:
          submodules: recursive
          # third_party/shacl-aio is a PRIVATE repo; the default GITHUB_TOKEN can't reach it, so recursive
          # submodule checkout 403s. SUBMODULES_TOKEN: fine-grained PAT, Contents:read on deferno-kmp +
          # shacl-aio. checkout rewrites the SSH submodule URL to HTTPS and auths with it.
          token: ${{ secrets.SUBMODULES_TOKEN }}

      # Temurin 17 is the toolchain the build pins (ProjectConfig.JVM_TOOLCHAIN /
      # gradle-daemon-jvm.properties). The Gradle run inside the Xcode Run Script phase (below) uses it
      # as the daemon + project toolchain, so Foojay does not download a second JDK.
      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Configuring the whole build touches the Android modules + :speech-whisper-jni (which declares
      # ndkVersion = ProjectConfig.NDK_VERSION + an externalNativeBuild). The macOS runner preinstalls
      # the Android SDK but not this exact NDK; install it + accept licences so full-project
      # configuration — which the iOS framework task triggers — succeeds. Keep in lockstep with
      # ProjectConfig.NDK_VERSION (and with ci.yml's matching step).
      - name: Install Android NDK + CMake for full-project configuration (#92)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          # Retry: a transient corrupt mirror download ("Error on ZipFile unknown archive") otherwise
          # fails the whole gate (see memory ci-ndk-probe-flake — a no-code re-run went green).
          # sdkmanager is idempotent, so a retry only re-fetches the missing/corrupt package.
          for attempt in 1 2 3; do
            "$SDKMANAGER" "ndk;30.0.14904198" "cmake;3.22.1" && exit 0
            echo "::warning::sdkmanager install attempt $attempt failed; retrying in 10s…" >&2
            sleep 10
          done
          echo "::error::sdkmanager NDK/CMake install failed after 3 attempts." >&2
          exit 1

      # Match the dev machine (Xcode 26.x). Two source-level requirements put a hard floor here, both
      # introduced with the Apple warning sweep: `@retroactive` on the Bridge/Identity.swift conformances
      # needs the **Swift 6 compiler** (Xcode 16+), and `.allowBluetoothHFP` in BrainDumpRecorder needs the
      # **iOS 26 SDK** (the symbol is back-deployed to iOS 1.0 but only *declared* from that SDK on). The
      # deployment target is still iOS 16 — this is a toolchain floor, not a product one.
      #
      # FAIL LOUDLY when the image has no Xcode 26, the way testflight.yml already does. The old form here
      # was `if [ -n "$XC" ]; then …; fi` — a silent no-op fall-through that left the runner default
      # selected, which is half of how this gate went green on a toolchain that couldn't build the branch.
      - name: Select Xcode 26 (iOS 26 SDK, Swift 6 compiler)
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XC" ]; then
            echo "::error::No Xcode 26 found — this app needs the iOS 26 SDK and the Swift 6 compiler."
            ls -d /Applications/Xcode_*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      # Pick a simulator that actually exists on the image instead of naming a model. The hardcoded
      # `iPhone 15` here outlived the iOS 17 runtime that carried it, and a destination that resolves to
      # nothing is a failure mode this gate has already proven it can swallow. Resolve at runtime, and
      # carry the **UDID** rather than the name: two simulators may share a model name (a second one gets
      # created easily), and `name:` then fails with "multiple devices matched" — an id never does.
      - name: Resolve an iOS Simulator destination
        run: |
          DEVICE="$(xcrun simctl list devices available --json \
            | jq -c '[.devices | to_entries[] | select(.key | test("SimRuntime.iOS"))
                      | .value[] | select(.name | startswith("iPhone"))] | first')"
          if [ -z "$DEVICE" ] || [ "$DEVICE" = "null" ]; then
            echo "::error::No iPhone simulator available on this image."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Simulator destination: $(jq -r '"\(.name) (\(.udid))"' <<<"$DEVICE")"
          echo "SIM_ID=$(jq -r .udid <<<"$DEVICE")" >> "$GITHUB_ENV"

      # CocoaPods is preinstalled on the runner. Cache the CDN spec data + the integrated Pods so repeat
      # runs skip the network. Keyed on the committed Podfile.lock (Pods/ itself is gitignored).
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            app/iosApp/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('app/iosApp/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: pod install (SQLCipher)
        working-directory: app/iosApp
        run: pod install

      # The single command that exercises the whole stack: xcodebuild runs the project's Run Script
      # phase first (./gradlew :app:iosApp:embedAndSignAppleFrameworkForXcode → the static
      # Deferno.framework for this SDK/arch), then compiles the SwiftUI sources, links them against the
      # framework + the SQLCipher pod, and runs the iosAppTests suite (#28) on the simulator — the real
      # signal that the framework, the SKIE-free bridge, SQLCipher, and the tests all resolve and pass
      # (#38). The Pods workspace (not the bare .xcodeproj) is required once a pod is integrated.
      # **Ad-hoc** signing (`CODE_SIGN_IDENTITY="-"`, no team, no profile) rather than the old
      # CODE_SIGNING_ALLOWED=NO. That flag's rationale — "the tests drive the in-memory DefernoDemo, which
      # touches no Keychain" — stopped being true when DefernoApp.init started building the REAL DI graph
      # at launch (ADR-0013/0017): the test *host app* now opens the Keychain-backed vault on startup, and
      # an unsigned iOS app can't use the Keychain, so it aborts before the test runner ever connects.
      # Ad-hoc signing gives the simulator build the entitlement it needs and needs no certificate, so it
      # works on a bare runner. The destination comes from the resolve step above.
      #
      # SWIFT_TREAT_WARNINGS_AS_ERRORS is the ratchet: the app compiles warning-free on the Xcode this
      # job selects, and a build-warnings cleanup with nothing holding the line just decays. Passed on the
      # command line, not set in the project, so a local Xcode build still only warns — and so a future
      # image bumping Xcode under us breaks CI loudly (which is the signal) rather than silently
      # reaccumulating warnings. Drop the flag here if that day needs an escape hatch.
      - name: Build & test (framework + app, iOS Simulator)
        working-directory: app/iosApp
        # `set -o pipefail` is the whole gate. GitHub's default `run:` shell is `bash -e {0}` — with NO
        # pipefail — so piping xcodebuild into a formatter hands the step xcbeautify's exit status and a
        # failed build reports green. That is exactly what happened before this line existed. (testflight.yml
        # already sets it.) xcbeautify is preinstalled; fall back to cat if a future image drops it.
        run: |
          set -o pipefail
          if command -v xcbeautify >/dev/null 2>&1; then FMT=(xcbeautify --renderer github-actions); else FMT=(cat); fi
          xcodebuild \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath build/dd \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            test | "${FMT[@]}"

      - name: Upload xcodebuild logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-logs
          path: app/iosApp/build/dd/Logs/**
          if-no-files-found: warn
